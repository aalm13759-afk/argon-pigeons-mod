name: Build Argon Loft Pigeons Mod (1.20.1)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. سحب الملفات من المستودع
        uses: actions/checkout@v4

      - name: 2. فك ضغط ملف المود تلقائياً (إن كان مرفوعاً بصيغة zip)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
            if [ -d "argon_loft_pigeons_forge_1.20.1" ]; then
              cp -rn argon_loft_pigeons_forge_1.20.1/* .
            fi
          fi
          ls -la

      - name: 3. تثبيت Java 17 لماينكرافت 1.20.1
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. تجهيز أداة البناء Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 5. ترجمة الكود وبناء ملف المود (Compile JAR)
        run: gradle build --no-daemon

      - name: 6. رفع ملف المود الجاهز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: argonloftpigeons-1.20.1-mod-jar
          path: build/libs/*.jar
          
